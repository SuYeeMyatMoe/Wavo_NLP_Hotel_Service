<section class="call-avatar">
  <button class="mascot" type="button" data-wavo-mascot>
    <span class="wavo-mascot-actor"><img src="app/static/wavo-concierge-cutout.png" alt="" draggable="false"></span>
  </button>
  <div class="call-state"><span class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><small role="status" aria-live="polite"></small></div>
  <p class="call-reply" aria-live="polite"></p>
  <button class="play-reply" type="button" hidden></button>
  <button class="send-turn" type="button" hidden></button>
  <div class="call-controls">
    <button class="microphone" type="button"></button>
    <button class="hangup" type="button"></button>
  </div>
</section>
