[server]
enableStaticServing = true
headless = true
[theme]
base = "dark"
primaryColor = "#DDB479"
backgroundColor = "#21140E"
secondaryBackgroundColor = "#342218"
textColor = "#F0DFC9"
borderColor = "#765339"
font = "sans serif"
baseRadius = "medium"
linkColor = "#E7BC80"
chartCategoricalColors = ["#E7BC80", "#BC946C", "#DDD0A7", "#8AB499", "#DE9D84", "#B1A8AF"]
[browser]
gatherUsageStats = false
[client]
toolbarMode = "minimal"

