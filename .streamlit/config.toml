[server]
enableStaticServing = true
headless = true
[theme]
base = "light"
primaryColor = "#70502D"
backgroundColor = "#FAF7F1"
secondaryBackgroundColor = "#F1E9DC"
textColor = "#30251D"
borderColor = "#D8C7B1"
font = "sans serif"
baseRadius = "medium"
linkColor = "#70502D"
chartCategoricalColors = ["#70502D", "#A27D52", "#C4AB89", "#57786A", "#B66D53", "#7B7370"]
[browser]
gatherUsageStats = false
[client]
toolbarMode = "minimal"

